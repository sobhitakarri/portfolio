<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══ Favicon ═══ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- ═══ Viewport & Theme ═══ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ef" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', t === 'dark' ? '#111113' : '#f5f3ef');
        } catch (e) {}
      })();
    </script>

    <!-- ═══ Primary SEO ═══ -->
    <title>Sobhita Karri | Robotics & Autonomous Systems Engineer</title>
    <meta name="description" content="Sobhita Karri — Robotics & Autonomous Systems Engineer. Building intelligent systems at the intersection of perception, planning, control, and embedded hardware." />
    <meta name="keywords" content="Robotics, Autonomous Systems, ROS 2, Computer Vision, Embedded Systems, Drone, FPGA, RTL, MATLAB, Simulink, LLM, VLM" />
    <meta name="author" content="Sobhita Karri" />
    <link rel="canonical" href="https://sobhitakarri.github.io/portfolio/" />

    <!-- ═══ Open Graph (LinkedIn, Facebook, WhatsApp) ═══ -->
