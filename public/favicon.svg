<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#060610"/>

  <!-- IC body -->
  <rect x="8" y="8" width="16" height="16" rx="2.5" fill="#0e0e1f" stroke="#00e5a0" stroke-width="1.5"/>

  <!-- Die surface -->
  <rect x="11" y="11" width="10" height="10" rx="1.5" fill="#00e5a012" stroke="#00e5a0" stroke-width="0.6"/>

  <!-- Notch (top) -->
  <path d="M14 8 A2 2 0 0 1 18 8" stroke="#00e5a0" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Pins left -->
  <line x1="2"  y1="12" x2="8"  y2="12" stroke="#00e5a0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="2"  y1="16" x2="8"  y2="16" stroke="#00e5a0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="2"  y1="20" x2="8"  y2="20" stroke="#00e5a0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Pins right -->
  <line x1="24" y1="12" x2="30" y2="12" stroke="#00e5a0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="16" x2="30" y2="16" stroke="#00e5a0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="20" x2="30" y2="20" stroke="#00e5a0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Die internal cross-hairs -->
  <line x1="13" y1="16" x2="19" y2="16" stroke="#00e5a0" stroke-width="0.5" opacity="0.5"/>
  <line x1="16" y1="13" x2="16" y2="19" stroke="#00e5a0" stroke-width="0.5" opacity="0.5"/>

  <!-- Center glow dot -->
  <circle cx="16" cy="16" r="1.2" fill="#00e5a0" opacity="0.9"/>
</svg>
